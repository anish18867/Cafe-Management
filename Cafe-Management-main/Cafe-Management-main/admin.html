<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - The Cafe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="mynav.css">
    <link rel="stylesheet" href="admin.css">
    <script src="jquery-3.6.4.min.js"></script>
    <script src="mynav.js"></script>
    <script src="auth.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="shortcut icon" href="images/cafe_fav.png">
    <style>
        :root {
            --primary-coffee: #6F554D;
            --secondary-cream: #F4E4BC;
            --accent-gold: #D4A574;
        }
        body { background-color: var(--secondary-cream); }
        .sidebar { background: var(--primary-coffee); min-height: 100vh; }
        .nav-link-admin { color: white !important; }
        .nav-link-admin:hover, .nav-link-admin.active { background: var(--accent-gold); }
        .dashboard-card { background: white; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <!-- Navigation (same as other pages) -->
    <nav class="navbar navbar-light navbar-expand-md navbar-fixed-top navigation-clean-button">
        <div class="container">
            <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#mynav"><span class="visually-hidden">Toggle navigation</span><span class="navbar-toggler-icon"></span></button>
            <div><a href="index.html" class="navbar-brand"><strong>The Cafe - Admin</strong></a></div>
            <div class="collapse navbar-collapse" id="mynav">
                <ul class="navbar-nav navbar-right">
                    <li class="nav-item"><a href="index.html" class="nav-link">Home</a></li>
                    <li class="nav-item dropdown">
                        <a class="dropdown-toggle nav-link" data-bs-toggle="dropdown" href="#">Services</a>
                        <div class="dropdown-menu">
                            <a href="menu.html" class="dropdown-item">Menu</a>
                            <a href="order.html" class="dropdown-item">Your Order</a>
                        </div>
                    </div>
                    <li class="nav-item"><a href="about.html" class="nav-link">About</a></li>
                    <li class="nav-item" id="navAuthSection"><!-- Dynamic --></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-5 pt-4">
        <div class="row">
            <!-- Sidebar -->
            <nav id="sidebar" class="col-md-3 col-lg-2 d-md-block sidebar collapse">
                <div class="position-sticky pt-3">
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link nav-link-admin active" href="#" data-tab="menu-mgmt">🍽️ Menu Management</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link nav-link-admin" href="#" data-tab="orders">📋 View Orders</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link nav-link-admin" href="#" data-tab="users">👥 User Management</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link nav-link-admin" href="#" data-tab="stats">📊 Statistics</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link nav-link-admin text-danger" href="index.html" onclick="auth.logout()">🚪 Logout</a>
                        </li>
                    </ul>
                </div>
            </nav>

            <!-- Main content -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
                <h1 class="h2 mb-4 text-dark">Admin Dashboard</h1>
                
                <!-- Menu Management Tab -->
                <div id="menu-mgmt" class="tab-content dashboard-card p-4 mb-4">
                    <h3>Menu Items</h3>
                    <button class="btn btn-success mb-3" id="addMenuItemBtn">+ Add New Item</button>
                    <div id="menuList" class="row"></div>
                </div>

                <!-- Orders Tab -->
                <div id="orders" class="tab-content dashboard-card p-4 mb-4" style="display:none;">
                    <h3>Recent Orders</h3>
                    <div id="ordersList"></div>
                </div>

                <!-- Users Tab -->
                <div id="users" class="tab-content dashboard-card p-4 mb-4" style="display:none;">
                    <h3>Users</h3>
                    <div id="usersList"></div>
                </div>

                <!-- Stats Tab -->
                <div id="stats" class="tab-content dashboard-card p-4 mb-4" style="display:none;">
                    <h3>Statistics</h3>
                    <canvas id="salesChart" height="200"></canvas>
                    <div id="statsSummary" class="row mt-4"></div>
                </div>
            </main>
        </div>
    </div>

    <!-- Add/Edit Modal -->
    <div class="modal fade" id="menuModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Add Menu Item</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="menuForm">
                        <input type="hidden" id="editId">
                        <div class="mb-3"><label>Name</label><input type="text" id="itemName" class="form-control" required></div>
                        <div class="mb-3"><label>Price</label><input type="number" id="itemPrice" class="form-control" required></div>
                        <div class="mb-3"><label>Category</label>
                            <select id="itemCategory" class="form-control">
                                <option>Hot Beverages</option><option>Cold Beverages</option><option>Snacks</option>
                                <option>Indian Style Hot Beverages</option><option>Indian Style Cold Beverages</option>
                            </select>
                        </div>
                        <div class="mb-3"><label>Image URL</label><input type="url" id="itemImage" class="form-control"></div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="saveMenuBtn">Save</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="admin.js"></script>
    
    <script>
        // Init
        $(document).ready(function() {
            if (!auth.isAdmin()) {
                alert('Admin access required!');
                window.location.href = 'index.html';
            }
            updateNav();
            initDashboard();
        });
        
        function updateNav() {
            // Same nav logic as login.html
            const navAuthSection = $('#navAuthSection');
            const user = auth.getCurrentUser();
            if (user) {
                navAuthSection.html(`
                    <span class="nav-link">👑 Admin: ${user.username}</span>
                `);
            }
        }
    </script>
</body>
</html>
