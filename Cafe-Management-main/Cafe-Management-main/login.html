<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" crossorigin="anonymous">
    <link rel="stylesheet" href="about.css">
    <link rel="stylesheet" href="mynav.css">
    <script src="jquery-3.6.4.min.js"></script>
    <script src="mynav.js"></script>
    <script src="auth.js"></script>

    <!-- Favicon -->
    <link rel="shortcut icon" href="images/cafe_fav.png" type="image/x-icon">

    <style>
        /* Add your custom styles here */
        body {
            font-family: Arial, sans-serif;
            background-color: rgb(111, 85, 85);
        }
        .containerr {
            max-width: 600px;
            margin: 0 auto;
            padding: 40px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            margin-top: 100px;
            max-height: 450px;
        }
        .sign{
            text-align: center; /* Center align content */
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }
        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button[type="submit"] {
            padding: 10px 20px;
            background-color: #007bff;
            border: none;
            color: #fff;
            border-radius: 4px;
            cursor: pointer;
        }
        button[type="submit"]:hover {
            background-color: #0056b3;
        }
        .logout-btn {
            padding: 10px 20px;
            background-color: #dc3545;
            border: none;
            color: #fff;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
        .logout-btn:hover {
            background-color: #bb2d3b;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-light navbar-expand-md navbar-fixed-top navigation-clean-button">
        <div class="container">
            <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#mynav"><span
                    class="visually-hidden">.</span><span class="navbar-toggler-icon"></span></button>
            <div>
                <a href="index.html" class="navbar-brand
                "><span><strong>The Cafe</strong></span></a>
            </div>
            <div class="collapse navbar-collapse" id="mynav">
                <ul class="navbar-nav navbar-right">
                    <li class="nav-item">
                        <a href="index.html" class="nav-link active" style="color:rgb(255, 255, 255);">Home</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="dropdown-toggle nav-link" data-bs-toggle="dropdown" href="#"
                            style="color:rgba(255, 255, 255);">Services</a>
                        <div class="dropdown-menu">
                            <a href="menu.html" class="dropdown-item bg-dark" data-bss-hover-animate="pulse"
                                style="color:rgba(255, 255, 255);">Menu</a>
                            <a href="order.html" class="dropdown-item bg-dark d-fle" data-bss-hover-animate="pulse"
                                style="color:rgba(255, 255, 255);">Your Order</a>
                            <a href="trackorder.html" class="dropdown-item bg-dark d-fle" data-bss-hover-animate="pulse"
                                style="color:rgba(255, 255, 255);">Track your order</a>
                        </div>
                    </li>
                    <li class="nav-item">
                        <a href="about.html" class="nav-link active" style="color:rgba(255, 255, 255);">About Us</a>
                    </li>
                    <li class="nav-item">
                        <a href="contact.html" class="nav-link active" style="color:rgba(255, 255, 255);">Contact Us</a>
                    </li>
                    <li class="nav-item">
                        <a href="faq.html" class="nav-link active" style="color:rgba(255, 255, 255);">FAQ</a>
                    </li>
                    <li class="nav-item" id="navAuthSection">
                        <!-- Dynamic content: Login/Signup or Logout with username -->
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    
    <script>
        // Function to update navigation based on login status
        function updateNav() {
            const navAuthSection = document.getElementById('navAuthSection');
            const currentUser = auth.getCurrentUser();
            
            if (currentUser) {
                navAuthSection.innerHTML = `
                    <a class="nav-link dropdown-toggle" data-bs-toggle="dropdown" href="#" style="color:rgba(255, 255, 255);">
                        👤 ${currentUser.username}
                    </a>
                    <div class="dropdown-menu">
                        <a href="menu.html" class="dropdown-item bg-dark" style="color:rgba(255, 255, 255);">Menu</a>
                        <a href="order.html" class="dropdown-item bg-dark" style="color:rgba(255, 255, 255);">My Orders</a>
                        <a href="#" class="dropdown-item bg-dark" onclick="handleLogout()" style="color:rgba(255, 255, 255);">Logout</a>
                    </div>
                `;
            } else {
                navAuthSection.innerHTML = `
                    <a href="signup.html" class="nav-link active" style="color:rgba(255, 255, 255);">Sign Up</a>
                    <a href="login.html" class="nav-link active" style="color:rgba(255, 255, 255);">Login</a>
                `;
            }
        }
        
        // Logout function
        function handleLogout() {
            auth.logout();
            alert('Logged out successfully!');
            window.location.href = 'index.html';
        }
        
        // Initialize auth and update nav
        document.addEventListener('DOMContentLoaded', function() {
            auth.initAuth();
            updateNav();
        });
    </script>
    
    <!-- Your login form starts here -->
    <div class="containerr">
        <h2 class="sign">Login</h2>
        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
                <a href="forgotpassword.html" class="forgotps">Forgot Password?</a>
            </div>
            <div class="form-group" >
                <button type="submit">Login</button>
            </div>
            <div id="loginMessage" class="alert" style="display:none;"></div>
        </form>
        <p>Don't have an account? <a href="signup.html">Sign Up here</a>.</p>
        
        <div style="margin-top: 20px; padding: 10px; background: #f8f9fa; border-radius: 5px; font-size: 0.85rem;">
            <strong>Demo Accounts:</strong><br>
            username: admin, password: admin123<br>
            username: user, password: user123<br>
            username: test, password: test123
        </div>
    </div>
    <!-- Your login form ends here -->
    
    <script>
        // Initialize demo users in localStorage
        (function initDemoUsers() {
            const DEMO_USERS = [
                { username: 'admin', password: 'admin123' },
                { username: 'user', password: 'user123' },
                { username: 'test', password: 'test123' }
            ];
            if (!localStorage.getItem('cafe_users')) {
                localStorage.setItem('cafe_users', JSON.stringify(DEMO_USERS));
            }
            if (!localStorage.getItem('cafe_current_user')) {
                localStorage.setItem('cafe_current_user', null);
            }
        })();
        
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const messageDiv = document.getElementById('loginMessage');
            
            // Get users and check credentials
            const users = JSON.parse(localStorage.getItem('cafe_users')) || [];
            const user = users.find(u => u.username === username && u.password === password);
            
            if (user) {
                localStorage.setItem('cafe_current_user', JSON.stringify(user));
                messageDiv.className = 'alert alert-success';
                messageDiv.textContent = 'Login successful! Redirecting...';
                messageDiv.style.display = 'block';
                setTimeout(() => {
                    window.location.href = 'menu.html';
                }, 1000);
            } else {
                messageDiv.className = 'alert alert-danger';
                messageDiv.textContent = 'Invalid username or password';
                messageDiv.style.display = 'block';
            }
        });
        
        // Check if already logged in - redirect to menu
        const currentUser = localStorage.getItem('cafe_current_user');
        if (currentUser && currentUser !== 'null') {
            const user = JSON.parse(currentUser);
            // Just update the nav, don't redirect
            updateNav();
        }
    </script>
</body>
</html>
