    <script>
        // Function to update navigation based on login status
        function updateNav() {
            const navAuthSection = document.getElementById('navAuthSection');
            const currentUser = auth.getCurrentUser();
            
            if (currentUser) {
                navAuthSection.innerHTML = `
                    <a class="nav-link dropdown-toggle" data-bs-toggle="dropdown" href="#" style="color:rgba(255, 255, 255);">
                        👤 ${currentUser.username}
                    </a>
                    <div class="dropdown-menu">
                        <a href="menu.html" class="dropdown-item bg-dark" style="color:rgba(255, 255, 255);">Menu</a>
                        <a href="order.html" class="dropdown-item bg-dark" style="color:rgba(255, 255, 255);">My Orders</a>
                        <a href="#" class="dropdown-item bg-dark" onclick="handleLogout()" style="color:rgba(255, 255, 255);">Logout</a>
                    </div>
                `;
            } else {
                navAuthSection.innerHTML = `
                    <a href="signup.html" class="nav-link active" style="color:rgba(255, 255, 255);">Sign Up</a>
                    <a href="login.html" class="nav-link active" style="color:rgba(255, 255, 255);">Login</a>
                `;
            }
        }
        
        // Logout function
        function handleLogout() {
            auth.logout();
            alert('Logged out successfully!');
            window.location.href = 'index.html';
        }
        
        // Initialize auth and update nav
        document.addEventListener('DOMContentLoaded', function() {
            auth.initAuth();
            updateNav();
        });
    </script>
